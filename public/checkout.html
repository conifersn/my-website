<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - T-licX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 40px;
      max-width: 560px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #718096;
      margin-bottom: 28px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      font-size: 14px;
      color: #2d3748;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0a84ff;
      box-shadow: 0 0 0 3px rgba(10,132,255,0.12);
    }
    .product-info {
      background: #f7fafc;
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .product-info .name {
      font-weight: 500;
      color: #2d3748;
    }
    .product-info .price {
      font-weight: 700;
      color: #0a84ff;
      font-size: 18px;
    }
    .btn-pay {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0a84ff, #0066cc);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-pay:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(10,132,255,0.35);
    }
    .btn-pay:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .error.show { display: block; }
    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      color: #4a5568;
      font-size: 14px;
    }
    .loading.show { display: flex; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e2e8f0;
      border-top-color: #0a84ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Redirect notice */
    .redirect-notice {
      margin-top: 20px;
      padding: 16px;
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      font-size: 14px;
      color: #2b6cb0;
      text-align: center;
      display: none;
    }
    .redirect-notice.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>💳 Thanh toán</h1>
  <p class="subtitle">Nhập thông tin và hoàn tất đơn hàng</p>

  <form id="checkoutForm" novalidate>
    <div class="form-group">
      <label for="fullName">Họ và tên *</label>
      <input type="text" id="fullName" name="fullName" placeholder="Nguyễn Văn A" required>
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required>
    </div>
    <div class="form-group">
      <label for="phone">Số điện thoại *</label>
      <input type="tel" id="phone" name="phone" placeholder="0912345678" required>
    </div>

    <div class="product-info">
      <span class="name">🪟 Windows 10/11 Pro Key</span>
      <span class="price">2.000₫</span>
    </div>

    <button type="submit" class="btn-pay" id="payBtn">Thanh toán</button>
  </form>

  <div class="error" id="errorMsg"></div>
  <div class="loading" id="loadingIndicator">
    <div class="spinner"></div>
    <span>Đang tạo phiên thanh toán...</span>
  </div>


<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('checkoutForm');
  const payBtn = document.getElementById('payBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loading = document.getElementById('loadingIndicator');

  const PRODUCT_NAME = 'Windows 10/11 Pro Key';
  const PRODUCT_AMOUNT = 2000; // VND

  function showError(msg) {
    errorMsg.textContent = '❌ ' + msg;
    errorMsg.classList.add('show');
  }

  function hideError() {
    errorMsg.classList.remove('show');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const email    = document.getElementById('email').value.trim();
    const phone    = document.getElementById('phone').value.trim();

    if (!fullName || !email || !phone) {
      showError('Vui lòng điền đầy đủ thông tin.');
      return;
    }
    if (!email.includes('@')) {
      showError('Email không hợp lệ.');
      return;
    }
    hideError();

    payBtn.disabled = true;
    loading.classList.add('show');

    try {
      const payload = { fullName, email, phone, amount: PRODUCT_AMOUNT, product: PRODUCT_NAME };

      // BƯỚC 1: Tạo order pending trong database
      console.log('📝 Tạo order trong database...');
      const checkoutRes = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const checkoutData = await checkoutRes.json();
      if (!checkoutRes.ok || !checkoutData.success || !checkoutData.orderId || !checkoutData.invoiceNumber) {
        throw new Error(checkoutData.message || 'Tạo đơn hàng thất bại');
      }
      console.log('✅ Order created — orderId:', checkoutData.orderId, '| invoice:', checkoutData.invoiceNumber);

      // BƯỚC 2: Lấy signature từ server để submit Sepay
      // Truyền invoiceNumber từ bước 1 để server dùng đúng mã đã lưu vào DB
      console.log('📤 Lấy signature Sepay...');
      const sigRes = await fetch('/generate-signature', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...payload,
          orderId: checkoutData.orderId,
          invoiceNumber: checkoutData.invoiceNumber
        })
      });
      const sigData = await sigRes.json();
      if (!sigRes.ok || !sigData.success) {
        throw new Error(sigData.message || 'Lỗi tạo signature');
      }
      console.log('✅ Signature OK — chuyển hướng Sepay...');

      // BƯỚC 3: Tạo form và submit tới Sepay (redirect)
      const sepayForm = document.createElement('form');
      sepayForm.method = 'POST';
      sepayForm.action = sigData.sepayUrl || 'https://pay.sepay.vn/v1/checkout/init';

      for (const [key, value] of Object.entries(sigData.fields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        sepayForm.appendChild(input);
      }

      document.body.appendChild(sepayForm);
      sepayForm.submit();
      // không remove form — browser sẽ navigate đi ngay

    } catch (err) {
      console.error('❌ Lỗi checkout:', err);
      showError(err.message);
      payBtn.disabled = false;
      loading.classList.remove('show');
    }
  });
});
</script>
</body>
</html>
